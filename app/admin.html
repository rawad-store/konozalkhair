<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة تحكم - كنوز الخير</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --g: #1b5e40; --bg: #f3f7f5; --card: #fff; --tx: #14291f; --ln: #d4e5db; --danger: #e74c3c; --success: #2a9d8f; }
  body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--tx); padding: 20px; max-width: 800px; margin: auto; }
  h1 { color: var(--g); text-align: center; margin-bottom: 30px; }
  .card { background: var(--card); padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 25px; border: 1px solid var(--ln); }
  .card h2 { font-size: 1.2rem; margin-bottom: 20px; color: var(--g); border-bottom: 2px solid var(--ln); padding-bottom: 10px; }
  label { display: block; margin: 12px 0 6px; font-weight: 600; font-size: 0.95rem; }
  input, textarea, select { width: 100%; padding: 12px; border: 1px solid var(--ln); border-radius: 8px; font-family: inherit; box-sizing: border-box; transition: border-color 0.2s; }
  input:focus, textarea:focus { outline: none; border-color: var(--g); }
  button { background: var(--g); color: #fff; border: none; padding: 14px 20px; border-radius: 8px; cursor: pointer; font-weight: 700; width: 100%; margin-top: 15px; transition: 0.2s; font-size: 1rem; }
  button:hover { opacity: 0.9; }
  .btn-danger { background: var(--danger); padding: 8px 14px; width: auto; margin: 0; font-size: 0.85rem; border-radius: 6px; }
  .btn-edit { background: #f39c12; padding: 8px 14px; width: auto; margin: 0; font-size: 0.85rem; border-radius: 6px; }
  .btn-export { background: #2980b9; }
  .btn-github { background: #24292e; }
  .btn-success { background: var(--success); }
  .case-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--ln); padding: 15px 0; }
  .case-item:last-child { border-bottom: none; }
  .case-info h3 { margin: 0 0 5px; font-size: 1.1rem; color: var(--g); }
  .case-info p { margin: 0; font-size: 0.85rem; color: #666; }
  .actions { display: flex; gap: 8px; }
  .config-box { background: #fff3cd; border: 1px solid #ffeeba; }
</style>
</head>
<body>

<h1>لوحة تحكم الحالات</h1>

<!-- إعدادات GitHub -->
<div class="card config-box">
  <h2>⚙️ إعدادات الاتصال بـ GitHub (للتحديث المباشر)</h2>
  <p style="font-size: 0.85rem; color: #856404; margin-bottom: 15px;">يتم حفظ هذه الإعدادات في متصفحك فقط لتسهيل النشر المباشر.</p>
  <div style="display: flex; gap: 15px;">
    <div style="flex: 1;">
      <label>اسم المستخدم (Owner)</label>
      <input type="text" id="gh-owner" placeholder="rawad-store" value="rawad-store">
    </div>
    <div style="flex: 1;">
      <label>اسم المستودع (Repo)</label>
      <input type="text" id="gh-repo" placeholder="konozalkhair" value="konozalkhair">
    </div>
  </div>
  <label>مفتاح الوصول (Token)</label>
  <input type="password" id="gh-token" placeholder="ghp_xxxxxxxxxxxx">
</div>

<!-- نموذج الإضافة/التعديل -->
<div class="card">
  <h2 id="form-title">📝 إضافة حالة جديدة</h2>
  
  <!-- هذا هو الحقل المخفي الذي كان مفقوداً -->
  <input type="hidden" id="edit-id">
  
  <label>عنوان الحالة</label>
  <input type="text" id="title" placeholder="مثال: كفالة يتيم">
  
  <label>الوصف</label>
  <textarea id="description" rows="3" placeholder="تفاصيل الحالة..."></textarea>
  
  <div style="display: flex; gap: 15px;">
    <div style="flex: 1;">
      <label>المبلغ المطلوب</label>
      <input type="text" id="needed" placeholder="مثال: 500 جنيه">
    </div>
    <div style="flex: 1;">
      <label>الموقع</label>
      <input type="text" id="location" placeholder="مثال: الصوة - الشرقية">
    </div>
  </div>
  
  <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; margin-top: 15px;">
    <input type="checkbox" id="urgent" style="width: 20px; height: 20px; accent-color: var(--danger); margin: 0;"> 
    <span style="color: var(--danger);">حالة عاجلة؟</span>
  </label>

  <button type="button" class="btn-success" id="btn-save" onclick="saveCase()">➕ إضافة الحالة</button>
  <button type="button" class="btn-export" onclick="clearForm()" style="background: #6c757d;">مسح الحقول</button>
</div>

<!-- أزرار النشر -->
<div class="card">
  <h2>🚀 نشر التحديثات</h2>
  <p style="font-size: 0.9rem; color: #666; margin-bottom: 15px;">بعد إضافة الحالات، قم بتحديث الموقع:</p>
  
  <button type="button" class="btn-github" onclick="updateGitHub()">تحديث مباشر على GitHub (بدون رفع يدوي)</button>
  <button type="button" class="btn-export" onclick="exportData()" style="margin-top: 10px;">⬇️ تصدير ملف cases.json (يدوياً)</button>
</div>

<!-- قائمة الحالات -->
<div class="card">
  <h2>📋 الحالات المضافة</h2>
  <div id="cases-list"></div>
</div>

<script>
// تحميل البيانات من الذاكرة المحلية
let cases = JSON.parse(localStorage.getItem('admin_cases')) || [];
let editingIndex = -1;

// تحميل إعدادات GitHub المحفوظة مسبقاً
document.getElementById('gh-owner').value = localStorage.getItem('gh_owner') || 'rawad-store';
document.getElementById('gh-repo').value = localStorage.getItem('gh_repo') || 'konozalkhair';
document.getElementById('gh-token').value = localStorage.getItem('gh_token') || '';

function renderList() {
  const list = document.getElementById('cases-list');
  list.innerHTML = '';
  
  if (cases.length === 0) {
    list.innerHTML = '<p style="text-align:center; color:#888;">لا توجد حالات مضافة حالياً.</p>';
    return;
  }
  
  cases.forEach((c, index) => {
    const div = document.createElement('div');
    div.className = 'case-item';
    div.innerHTML = `
      <div class="case-info">
        <h3>${c.title} ${c.urgent ? '<span style="color:var(--danger); font-size:0.8rem;">(عاجل)</span>' : ''}</h3>
        <p>📍 ${c.location} | 💰 ${c.needed}</p>
      </div>
      <div class="actions">
        <button type="button" class="btn-edit" onclick="editCase(${index})">تعديل</button>
        <button type="button" class="btn-danger" onclick="deleteCase(${index})">حذف</button>
      </div>
    `;
    list.appendChild(div);
  });
}

function saveCase() {
  const id = document.getElementById('edit-id').value;
  const title = document.getElementById('title').value.trim();
  
  if (!title) {
    alert('يجب كتابة عنوان للحالة');
    return;
  }

  const newCase = {
    id: id ? parseInt(id) : Date.now(), // إنشاء معرف فريد بناءً على الوقت
    title: title,
    description: document.getElementById('description').value.trim(),
    needed: document.getElementById('needed').value.trim(),
    location: document.getElementById('location').value.trim(),
    urgent: document.getElementById('urgent').checked,
    image: ""
  };

  if (editingIndex > -1) {
    // تحديث حالة موجودة
    cases[editingIndex] = newCase;
  } else {
    // إضافة حالة جديدة
    cases.push(newCase);
  }

  localStorage.setItem('admin_cases', JSON.stringify(cases));
  clearForm();
  renderList();
  alert('✅ تم الحفظ محلياً بنجاح! لا تنسى النشر إلى GitHub.');
}

function editCase(index) {
  editingIndex = index;
  const c = cases[index];
  
  document.getElementById('form-title').innerText = '✏️ تعديل الحالة';
  document.getElementById('edit-id').value = c.id;
  document.getElementById('title').value = c.title;
  document.getElementById('description').value = c.description;
  document.getElementById('needed').value = c.needed;
  document.getElementById('location').value = c.location;
  document.getElementById('urgent').checked = c.urgent;
  
  document.getElementById('btn-save').innerHTML = '💾 تحديث الحالة';
  window.scrollTo(0, 0);
}

function deleteCase(index) {
  if (confirm('هل أنت متأكد من حذف هذه الحالة؟')) {
    cases.splice(index, 1);
    localStorage.setItem('admin_cases', JSON.stringify(cases));
    renderList();
  }
}

function clearForm() {
  editingIndex = -1;
  document.getElementById('form-title').innerText = '📝 إضافة حالة جديدة';
  document.getElementById('edit-id').value = '';
  document.getElementById('title').value = '';
  document.getElementById('description').value = '';
  document.getElementById('needed').value = '';
  document.getElementById('location').value = '';
  document.getElementById('urgent').checked = false;
  document.getElementById('btn-save').innerHTML = '➕ إضافة الحالة';
}

function exportData() {
  if(cases.length === 0) { alert('لا توجد بيانات لتصديرها'); return; }
  const dataStr = JSON.stringify(cases, null, 2);
  const blob = new Blob([dataStr], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'cases.json';
  a.click();
  URL.revokeObjectURL(url);
}

// ===== التحديث المباشر عبر GitHub API =====
async function updateGitHub() {
  const owner = document.getElementById('gh-owner').value.trim();
  const repo = document.getElementById('gh-repo').value.trim();
  const token = document.getElementById('gh-token').value.trim();
  const path = 'cases.json';

  if (!owner || !repo || !token) {
    alert('يرجى ملء بيانات GitHub (المستخدم، المستودع، والمفتاح) أولاً.');
    return;
  }

  if (cases.length === 0) {
    alert('لا توجد حالات لنشرها.');
    return;
  }

  // حفظ الإعدادات للاستخدام المستقبلي
  localStorage.setItem('gh_owner', owner);
  localStorage.setItem('gh_repo', repo);
  localStorage.setItem('gh_token', token);

  const content = JSON.stringify(cases, null, 2);
  // ترميز المحتوى إلى Base64 لدعم اللغة العربية
  const base64Content = btoa(unescape(encodeURIComponent(content)));
  const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;

  const btn = document.querySelector('.btn-github');
  const originalText = btn.innerHTML;
  btn.innerHTML = '⏳ جاري النشر...';
  btn.disabled = true;

  try {
    // 1. جلب الـ SHA الحالي للملف (إذا كان موجوداً)
    let sha = null;
    const getRes = await fetch(apiUrl, {
      headers: { 'Authorization': `Bearer ${token}` }
    });
    
    if (getRes.ok) {
      const fileData = await getRes.json();
      sha = fileData.sha;
    } else if (getRes.status === 401) {
      alert('❌ فشل الاتصال: المفتاح (Token) غير صحيح أو منتهي الصلاحية.');
      return;
    }

    // 2. إرسال الطلب لتحديث الملف
    const body = {
      message: 'تحديث الحالات من لوحة التحكم',
      content: base64Content,
      branch: 'main'
    };
    if (sha) body.sha = sha; // ضروري لتحديث ملف موجود

    const putRes = await fetch(apiUrl, {
      method: 'PUT',
      headers: {
        'Authorization': `Bearer ${token}`,
        'Content-Type': 'application/json',
        'Accept': 'application/vnd.github+json'
      },
      body: JSON.stringify(body)
    });

    if (putRes.ok) {
      alert('✅ تم النشر على GitHub بنجاح! سيظهر التغيير للجميع بعد تحديث الكاش (قد يستغرق دقيقة).');
    } else {
      const err = await putRes.json();
      alert('❌ فشل التحديث: ' + (err.message || 'تأكد من صحة المفتاح والصلاحيات.'));
    }
  } catch (e) {
    alert('❌ خطأ في الاتصال بالإنترنت: ' + e.message);
  } finally {
    btn.innerHTML = originalText;
    btn.disabled = false;
  }
}

// تحميل الحالات من الملف الأصلي إذا كانت الذاكرة فارغة (لأول مرة فقط)
if (cases.length === 0) {
  fetch('./cases.json')
    .then(r => r.json())
    .then(data => {
      cases = data;
      localStorage.setItem('admin_cases', JSON.stringify(cases));
      renderList();
    })
    .catch(() => renderList());
} else {
  renderList();
}
</script>
</body>
</html>
